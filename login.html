<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alerta de Pets</title>

    <!-- FONTE MODERNA -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:'Poppins', sans-serif;

            background: linear-gradient(135deg, #4A90E2, #6FB1FC);

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;
        }

        /* ================= CARD LOGIN ================= */

        .login-container{

            background:white;

            width:100%;
            max-width:400px;

            padding:40px;

            border-radius:25px;

            box-shadow:0 15px 35px rgba(0,0,0,0.12);

            text-align:center;

            animation:fadeIn 0.6s ease;
        }

        /* ================= TÍTULO ================= */

        .login-container h1{

            margin-bottom:25px;

            font-size:32px;

            color:#4A90E2;

            font-weight:700;
        }

        /* ================= INPUTS ================= */

        input{

            width:100%;

            padding:14px;

            margin:10px 0;

            border-radius:14px;

            border:1px solid #dcdcdc;

            outline:none;

            font-size:15px;

            font-family:'Poppins', sans-serif;

            transition:0.3s;
        }

        input:focus{

            border-color:#4A90E2;

            box-shadow:0 0 10px rgba(74,144,226,0.2);
        }

        /* ================= BOTÃO ================= */

        button {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(135deg, #4A90E2, #6FB1FC);

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(74,144,226,0.25);
        }

        /* ================= TOGGLE ================= */

        .toggle{

            margin-top:20px;

            font-size:14px;

            color:#666;

            cursor:pointer;
        }

        .toggle span{

            color:#4A90E2;

            font-weight:600;
        }

        /* ================= TEXTO EXTRA ================= */

        .subtitulo{

            color:#777;

            margin-bottom:25px;

            font-size:15px;

            line-height:1.5;
        }

        /* ================= ANIMAÇÃO ================= */

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        /* ================= RESPONSIVO ================= */

        @media(max-width:500px){

            .login-container{
                padding:30px 25px;
            }

            .login-container h1{
                font-size:28px;
            }

        }

    </style>
</head>

<body>

<div class="login-container">

    <h1 id="tituloForm">🐾 Zoopaw</h1>

    <p class="subtitulo">
        Faça login para cadastrar e acompanhar pets desaparecidos.
    </p>

    <input 
        type="email" 
        id="email" 
        placeholder="Digite seu email"
    >

    <input 
        type="password" 
        id="senha" 
        placeholder="Digite sua senha"
    >

    <button onclick="acao()">
        Entrar
    </button>

    <div class="toggle" onclick="alternar()">
        Não tem conta? <span>Cadastrar</span>
    </div>

</div>

<script>

    let modo = "login";

    function alternar() {

        let titulo = document.getElementById("tituloForm");

        let botao = document.querySelector("button");

        let toggle = document.querySelector(".toggle");

        let subtitulo = document.querySelector(".subtitulo");

        if (modo === "login") {

            modo = "cadastro";

            titulo.innerText = "🐾 Criar Conta";

            botao.innerText = "Cadastrar";

            subtitulo.innerText =
                "Crie sua conta para divulgar pets desaparecidos.";

            toggle.innerHTML =
                'Já tem conta? <span>Entrar</span>';

        } else {

            modo = "login";

            titulo.innerText = "🐾 Zoopaw";

            botao.innerText = "Entrar";

            subtitulo.innerText =
                "Faça login para cadastrar e acompanhar pets desaparecidos.";

            toggle.innerHTML =
                'Não tem conta? <span>Cadastrar</span>';
        }
    }

    function acao() {

        let email = document.getElementById("email").value;

        let senha = document.getElementById("senha").value;

        let users =
            JSON.parse(localStorage.getItem("users")) || [];

        // ================= CADASTRO =================

        if (modo === "cadastro") {

            let existe =
                users.find(u => u.email === email);

            if (existe) {

                alert("Usuário já existe!");

                return;
            }

            users.push({ email, senha });

            localStorage.setItem(
                "users",
                JSON.stringify(users)
            );

            alert("Cadastro realizado com sucesso!");

            alternar();

        }

        // ================= LOGIN =================

        else {

            let user =
                users.find(
                    u => u.email === email &&
                    u.senha === senha
                );

            if (!user) {

                alert("Email ou senha inválidos!");

                return;
            }

            localStorage.setItem(
                "currentUser",
                JSON.stringify({ email })
            );

            alert("Login feito com sucesso!");

            window.location.href = "index.html";
        }
    }

</script>

</body>
</html>
