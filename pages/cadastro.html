<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Pet</title>

    <!-- 🔥 FONTE MODERNA -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            margin:0;
            font-family:'Poppins', sans-serif;
            background: linear-gradient(180deg, #f4f4f4, #e9e9e9);
        }

        header{
            background: linear-gradient(135deg, #ff914d, #ff6b2c);
            color:white;
            padding:25px;
            text-align:center;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        header h1{
            font-weight:700;
            letter-spacing:1px;
        }

        nav{
            background-color:#222;
            padding:12px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:600;
            transition:0.3s;
        }

        nav a:hover{
            color:#ff914d;
        }

        /* ================= CENTRO ================= */

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:80vh;
            padding:30px;
        }

        /* ================= CARD ================= */

        .card{
            background:white;
            width:420px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            text-align:center;
        }

        .card h2{
            color:#ff6b2c;
            margin-bottom:20px;
            font-weight:700;
        }

        /* ================= INPUTS ================= */

        input,
        textarea{
            width:100%;
            padding:12px;
            margin-top:10px;
            border-radius:10px;
            border:1px solid #ddd;
            outline:none;
            font-family:'Poppins', sans-serif;
            transition:0.3s;
        }

        input:focus,
        textarea:focus{
            border-color:#ff914d;
            box-shadow:0 0 5px rgba(255,145,77,0.4);
        }

        textarea{
            resize:none;
            height:120px;
        }

        input[type="file"]{
            background:white;
            padding:8px;
        }

        /* ================= BOTÃO ================= */

        button{
            margin-top:15px;
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background: linear-gradient(135deg, #ff914d, #ff6b2c);
            color:white;
            font-weight:700;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.03);
        }

    </style>
</head>

<body>

<header>
    <h1>🐾 Cadastro de Pets</h1>
</header>

<nav>
    <a href="../index.html">Home</a>
    <a href="cadastro.html">Cadastrar Pet</a>
    <a href="pets.html">Pets Perdidos</a>
</nav>

<div class="container">

    <div class="card">

        <h2>Registrar Animal</h2>

        <form id="formPet">

            <input type="text" id="nome" placeholder="Nome do pet">

            <input type="text" id="raca" placeholder="Raça">

            <input type="text" id="telefone" placeholder="Telefone">

            <textarea id="descricao" placeholder="Descrição do desaparecimento"></textarea>

            <input type="text" id="cidade" placeholder="Cidade">

            <input type="text" id="bairro" placeholder="Bairro">

            <input type="date" id="dataPerda">

            <input type="file" id="foto" accept="image/*">

            <button type="submit">Cadastrar Pet</button>

        </form>

    </div>

</div>
            <script src="../js/script.js"></script>
</body>
</html>
